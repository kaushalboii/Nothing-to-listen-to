name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          BASE_PATH: /Nothing-to-listen-to/
        run: npm run build

      - name: Create release distribution archive
        run: |
          cd dist && zip -r ../nothing-to-listen-to-${{ github.ref_name || github.event.inputs.tag }}.zip ./* && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nothing to Listen to ${{ github.ref_name || github.event.inputs.tag }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: nothing-to-listen-to-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🎵 Nothing to Listen to - Release ${{ github.ref_name || github.event.inputs.tag }}

            ### ✨ Key Features in this Release:
            - **1:1 Square Vinyl Album WebGL Simulation**: Purpose-built Voroforce engine and custom GLSL shaders displaying album art in square format.
            - **Direct In-App Ad-Free YouTube Player**: Privacy-enhanced streaming player (`youtube-nocookie.com`) allowing full songs and music videos to play directly inside the app with zero pre-roll ad networks.
            - **Persistent Mini-Player**: Floating player at the bottom right that keeps playing music continuously while you browse the galaxy.
            - **Everywhere Streaming**: One-click listening on **Spotify**, **Apple Music**, and **YouTube Music** for every song and album.
            - **Real Dynamic Music Sync Engine (`scripts/sync-music.py`)**: Automatic fetching from YouTube & music charts without hardcoding.
            - **Automated YouTube Sync Workflow (`.github/workflows/update-music.yml`)**: Daily automated cron job to sync newly uploaded YouTube tracks.
            - **GitHub Pages Deployment**: Dual-mode deployment to `gh-pages` branch and GitHub Actions Pages.
            - **Official Contact**: `contact.nothingtolisten@gmail.com`.
