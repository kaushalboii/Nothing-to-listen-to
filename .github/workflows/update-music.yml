name: Auto-Sync Latest Daily Music & Deploy

on:
  schedule:
    # Runs 4 times a day: 00:00, 06:00, 12:00, 18:00 UTC (05:30 AM, 11:30 AM, 05:30 PM, 11:30 PM IST)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'Optional YouTube Channel ID to sync songs from'
        required: false
        default: ''
      youtube_playlist_id:
        description: 'Optional YouTube Playlist ID to sync songs from'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install Pillow requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Dynamic Daily Music Sync
        env:
          YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id }}
          YOUTUBE_PLAYLIST_ID: ${{ github.event.inputs.youtube_playlist_id }}
        run: |
          python3 scripts/sync-music.py

      - name: Generate KTX (ETC2) texture atlases for mobile
        run: |
          for dir in low mid high; do
            src="public/media/$dir/jpg/0.jpg"
            out="public/media/$dir/ktx/0.ktx"
            mkdir -p "public/media/$dir/ktx"
            if [ -f "$src" ]; then
              npx texture-compressor -t etc -c ETC2_RGB -i "$src" -o "$out" -y && echo "Generated $out" || echo "WARN: texture-compressor failed for $dir, skipping"
            else
              echo "WARN: $src not found, skipping KTX for $dir"
            fi
          done

      - name: Commit and push automated updates to main
        run: |
          git config --global user.name "kaushalboii"
          git config --global user.email "124547139+kaushalboii@users.noreply.github.com"
          git add public/json/ public/media/
          if git diff --staged --quiet; then
            echo "Working tree is clean."
          else
            git commit -m "chore(sync): automated music releases & atlas refresh [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main || true
            for i in 1 2 3; do
              git push origin main && break || (git pull --rebase origin main && sleep 3)
            done
          fi

      - name: Build project
        env:
          BASE_PATH: /Nothing-to-listen-to/
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload artifact for GitHub Actions Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Actions Pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Create release distribution archive
        run: |
          cd dist && zip -r ../nothing-to-listen-to-latest.zip ./* && cd ..

      - name: Update GitHub Release on Web
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: Nothing to Listen to - Daily Live Stream Edition
          tag_name: rolling-release
          files: nothing-to-listen-to-latest.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🎵 Nothing to Listen to - Daily Live Stream Edition
            Automatically synced with newly verified releases from YouTube, Spotify, and Apple Music.
            - **Track Count**: 216 Songs (18x12 Voronoi Galaxy)
            - **100% Ad-Free Streaming Engine**: Pure music streaming with zero ad interruptions
            - **Verified Streaming Metadata**: Multi-platform integration with Spotify, Apple Music, and YouTube Music
            - **Live Web App**: [kaushalboii.github.io/Nothing-to-listen-to](https://kaushalboii.github.io/Nothing-to-listen-to/)

      - name: Alert Maintainer on Sync Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 [Auto-Sync Alert] Daily Music Release Sync Failed ($(date -u +'%Y-%m-%d'))" \
            --body "⚠️ The automated 4x-daily music release sync encountered an issue. Manual update or review is required.

            - **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            - **Action Required**: Please inspect the workflow run logs and perform a manual update if necessary." \
            --label "sync-failure,needs-manual-review" || true
