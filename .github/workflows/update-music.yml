name: Auto-Sync Latest Daily Music & Deploy

on:
  schedule:
    # Runs daily at midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'Optional YouTube Channel ID to sync songs from'
        required: false
        default: ''
      youtube_playlist_id:
        description: 'Optional YouTube Playlist ID to sync songs from'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install Pillow requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Dynamic Daily Music Sync
        env:
          YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id }}
          YOUTUBE_PLAYLIST_ID: ${{ github.event.inputs.youtube_playlist_id }}
        run: |
          python3 scripts/sync-music.py

      - name: Commit and push daily updates to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/json/ public/media/
          if git diff --staged --quiet; then
            echo "No new music updates detected today."
          else
            git commit -m "chore: auto-sync daily music releases [$(date -u +'%Y-%m-%d')]"
            git push origin main
          fi

      - name: Build project
        env:
          BASE_PATH: /Nothing-to-listen-to/
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload artifact for GitHub Actions Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Actions Pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
