name: Auto-Sync Latest YouTube & Music Releases

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'Optional YouTube Channel ID to sync songs from'
        required: false
        default: ''
      youtube_playlist_id:
        description: 'Optional YouTube Playlist ID to sync songs from'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-music:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Music Sync Script
        run: |
          python3 scripts/sync-music.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/json/ public/media/
          if git diff --staged --quiet; then
            echo "No new music updates found."
          else
            git commit -m "chore: auto-sync latest YouTube & music releases"
            git push origin main
          fi
