<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Website Accent Glow & Gradients -->
    <radialGradient id="discBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Iridescent CD Reflection Rainbow -->
    <linearGradient id="cdSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Website Amber Center Hub -->
    <radialGradient id="centerHub" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring (Matching Website Branding) -->
  <circle cx="32" cy="32" r="30" fill="#09090b" stroke="#f59e0b" stroke-width="2" filter="url(#amberGlow)"/>

  <!-- CD / Vinyl Disc Body -->
  <circle cx="32" cy="32" r="27.5" fill="url(#discBody)"/>
  <circle cx="32" cy="32" r="27.5" fill="url(#cdSheen)"/>

  <!-- Precise Micro Grooves (CD / Vinyl Audio Tracks) -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#3f3f46" stroke-width="0.8" opacity="0.6"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#52525b" stroke-width="0.8" stroke-dasharray="8 3" opacity="0.7"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#3f3f46" stroke-width="0.8" opacity="0.6"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#52525b" stroke-width="0.8" stroke-dasharray="6 2.5" opacity="0.7"/>

  <!-- CD Disc Light Beams (Angular Shimmer) -->
  <path d="M32 4.5 L34 20 L30 20 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M32 59.5 L30 44 L34 44 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M4.5 32 L20 30 L20 34 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M59.5 32 L44 34 L44 30 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Center Vinyl Record Hub (Amber Theme) -->
  <circle cx="32" cy="32" r="10.5" fill="url(#centerHub)" stroke="#ffffff" stroke-width="0.75"/>

  <!-- Disc3 Music Spoke Notches (Symbolising the spinning player) -->
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#78350f" stroke-width="1.2" stroke-dasharray="3.5 2"/>

  <!-- Clear Inner CD Ring -->
  <circle cx="32" cy="32" r="4.8" fill="#18181b" stroke="#f59e0b" stroke-width="0.6"/>

  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="2.4" fill="#09090b" stroke="#d4d4d8" stroke-width="0.6"/>
</svg>