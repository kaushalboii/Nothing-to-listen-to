<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="sheenGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Vinyl Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#discGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Vinyl Micro Grooves -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="3 2"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#3f3f46" stroke-width="0.75"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 2.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#3f3f46" stroke-width="0.75"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Light Sheen Reflection -->
  <circle cx="32" cy="32" r="29" fill="url(#sheenGrad)" pointer-events="none"/>

  <!-- Center Record Label -->
  <circle cx="32" cy="32" r="11" fill="url(#labelGrad)" stroke="#ffffff" stroke-width="0.75"/>

  <!-- Center Music Note Symbol -->
  <path d="M30 26.5v8.2a2.8 2.8 0 1 1-1.8-2.6V28h5.6v5.2a2.8 2.8 0 1 1-1.8-2.6V26.5H30z" fill="#ffffff" opacity="0.95"/>

  <!-- Center Spindle Hole -->
  <circle cx="32" cy="32" r="2.2" fill="#09090b" stroke="#71717a" stroke-width="0.5"/>
</svg>
